spring.application.name=caverne
server.port=8080

# Database (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Authentication providers
auth.providers.supabase.enabled=${AUTH_PROVIDERS_SUPABASE_ENABLED:false}
auth.providers.supabase.jwt-secret=${AUTH_PROVIDERS_SUPABASE_JWT_SECRET:}
auth.providers.supabase.issuer=${AUTH_PROVIDERS_SUPABASE_ISSUER:}
auth.providers.supabase.audience=${AUTH_PROVIDERS_SUPABASE_AUDIENCE:authenticated}

# Stripe payment provider
stripe.enabled=false
stripe.api-key=${STRIPE_API_KEY}
stripe.api-version=2025-03-31.acacia
stripe.checkout-success-url=http://localhost:3000/checkout/success?session_id={CHECKOUT_SESSION_ID}
stripe.checkout-cancel-url=http://localhost:3000/checkout/cancel
