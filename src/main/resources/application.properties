spring.application.name=caverne
server.port=8080

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/caverne
spring.datasource.username=caverne
spring.datasource.password=caverne
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Stripe payment provider
stripe.enabled=false
stripe.api-key=sk_live_replace_me
stripe.api-version=2025-03-31.acacia
