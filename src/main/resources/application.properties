spring.application.name=caverne
server.port=${PORT:${SERVER_PORT:8080}}

# Database (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin}
app.cors.exposed-headers=${APP_CORS_EXPOSED_HEADERS:Location}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${APP_CORS_MAX_AGE:3600}

# Catalog niches import
catalog.niches-import.enabled=${CATALOG_NICHES_IMPORT_ENABLED:false}
catalog.niches-import.path=${CATALOG_NICHES_IMPORT_PATH:niches.md}

# Authentication providers
auth.providers.supabase.enabled=${AUTH_PROVIDERS_SUPABASE_ENABLED:false}
auth.providers.supabase.jwt-secret=${AUTH_PROVIDERS_SUPABASE_JWT_SECRET:}
auth.providers.supabase.issuer=${AUTH_PROVIDERS_SUPABASE_ISSUER:}
auth.providers.supabase.audience=${AUTH_PROVIDERS_SUPABASE_AUDIENCE:authenticated}

# Initial admin bootstrap
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
bootstrap.admin.firstname=${BOOTSTRAP_ADMIN_FIRSTNAME:Initial}
bootstrap.admin.lastname=${BOOTSTRAP_ADMIN_LASTNAME:Admin}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.phone=${BOOTSTRAP_ADMIN_PHONE:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Stripe payment provider
stripe.enabled=${STRIPE_ENABLED:false}
stripe.api-key=${STRIPE_API_KEY}
stripe.api-version=${STRIPE_API_VERSION:2025-03-31.acacia}
stripe.checkout-success-url=${STRIPE_CHECKOUT_SUCCESS_URL:http://localhost:3000/checkout/success?session_id={CHECKOUT_SESSION_ID}}
stripe.checkout-cancel-url=${STRIPE_CHECKOUT_CANCEL_URL:http://localhost:3000/checkout/cancel}
