# Surcharges prod: le reste est dans application.properties (profil commun)

# SQL Hibernate tu sur stdout en prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Niveaux de log - surchargeables via env LOGGING_LEVEL_* sur Render
logging.level.root=INFO
logging.level.com.devikapps.caverne=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
