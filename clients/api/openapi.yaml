openapi: 3.0.3
info:
  contact:
    name: Mr
  description: |
    Documentation OpenAPI de La Caverne Malagasy.
    Couvre l'ensemble des ressources : utilisateurs, catalogue, commandes, paiements, livraisons.
  title: La Caverne Malgache API
  version: 1.0.0
servers:
- description: Serveur avec préfixe API versionné
  url: http://localhost:8080/api/v1
  variables:
    version:
      default: v1
      description: Version HTTP exposée sous le préfixe `/api`
security:
- BearerAuth: []
tags:
- description: "Inscription, connexion, JWT"
  name: Auth
- description: Gestion des comptes utilisateurs
  name: Users
- description: Adresses de livraison
  name: Addresses
- description: Arborescence de catégories produits
  name: Categories
- description: Catalogue produits
  name: Products
- description: Commandes
  name: Orders
- description: Paiements initiés depuis une commande
  name: Payments
paths:
  /auth/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Utilisateur créé
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Données invalides
      security: []
      summary: Inscription d'un nouvel utilisateur
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: Token JWT retourné
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
      security: []
      summary: Connexion — obtenir un JWT
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/logout:
    post:
      responses:
        "204":
          description: Déconnexion réussie
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
      summary: Invalidation du token JWT courant
      tags:
      - Auth
      x-accepts:
      - application/json
  /users:
    get:
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - explode: true
        in: query
        name: role
        required: false
        schema:
          enum:
          - admin
          - simple_user
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_users_get_200_response"
          description: Liste paginée
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
      summary: Liste des utilisateurs (admin)
      tags:
      - Users
      x-accepts:
      - application/json
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Utilisateur créé
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Données invalides
      summary: Créer un utilisateur (admin)
      tags:
      - Users
      x-content-type: application/json
      x-accepts:
      - application/json
  /users/me:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Profil retourné
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
      summary: Profil de l'utilisateur connecté
      tags:
      - Users
      x-accepts:
      - application/json
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Profil mis à jour
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Données invalides
      summary: Mise à jour du profil
      tags:
      - Users
      x-content-type: application/json
      x-accepts:
      - application/json
  /users/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Supprimé
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ressource introuvable
      summary: Suppression d'un utilisateur (admin)
      tags:
      - Users
      x-accepts:
      - application/json
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ressource introuvable
      summary: Détail d'un utilisateur (admin)
      tags:
      - Users
      x-accepts:
      - application/json
  /users/me/addresses:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Address"
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
      summary: Liste des adresses de l'utilisateur connecté
      tags:
      - Addresses
      x-accepts:
      - application/json
    post:
      description: |
        Endpoint d'upsert. Si `id` est absent ou null dans le payload, une nouvelle adresse est créée. Si `id` est fourni et qu'une adresse appartenant à l'utilisateur existe, elle est mise à jour. Sinon, une nouvelle adresse est créée.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
          description: Adresse créée
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
          description: Adresse mise à jour
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
      summary: Créer ou mettre à jour une adresse
      tags:
      - Addresses
      x-content-type: application/json
      x-accepts:
      - application/json
  /users/me/addresses/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Supprimée
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ressource introuvable
      summary: Supprimer une adresse
      tags:
      - Addresses
      x-accepts:
      - application/json
    put:
      description: |
        Si l'adresse existe pour l'utilisateur connecté, elle est mise à jour. Sinon, une nouvelle adresse est créée et l'identifiant retourné fait foi.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
          description: Adresse mise à jour
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
          description: Adresse créée
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ressource introuvable
      summary: Créer ou mettre à jour une adresse par identifiant
      tags:
      - Addresses
      x-content-type: application/json
      x-accepts:
      - application/json
  /users/me/addresses/{id}/default:
    put:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
          description: Adresse définie par défaut
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
      summary: Définir comme adresse par défaut
      tags:
      - Addresses
      x-accepts:
      - application/json
  /categories:
    get:
      parameters:
      - description: "Si true, retourne une liste plate sans enfants"
        explode: true
        in: query
        name: flat
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Category"
                type: array
          description: OK
      security: []
      summary: Liste des catégories (arbre)
      tags:
      - Categories
      x-accepts:
      - application/json
    post:
      description: |
        Endpoint d'upsert. Si `id` est absent ou null dans le payload, une nouvelle catégorie est créée. Si `id` est fourni, la catégorie existante correspondante doit être mise à jour.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: Créée quand `id` est absent
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: Mise à jour quand `id` est fourni
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
      summary: Créer ou mettre à jour une catégorie (admin)
      tags:
      - Categories
      x-content-type: application/json
      x-accepts:
      - application/json
  /categories/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Supprimée
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
      summary: Supprimer une catégorie (admin)
      tags:
      - Categories
      x-accepts:
      - application/json
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ressource introuvable
      security: []
      summary: Détail d'une catégorie
      tags:
      - Categories
      x-accepts:
      - application/json
    put:
      description: |
        Si la catégorie existe, elle est mise à jour. Sinon, une nouvelle catégorie est créée et l'identifiant retourné fait foi. Si `id` est aussi fourni dans le payload, il doit correspondre à l'identifiant du path.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: Catégorie mise à jour
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: Catégorie créée
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ressource introuvable
      summary: Créer ou mettre à jour une catégorie par identifiant (admin)
      tags:
      - Categories
      x-content-type: application/json
      x-accepts:
      - application/json
  /products:
    get:
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - explode: true
        in: query
        name: category_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: is_active
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: currency
        required: false
        schema:
          example: MGA
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_products_get_200_response"
          description: Liste paginée
      security: []
      summary: Catalogue produits
      tags:
      - Products
      x-accepts:
      - application/json
    post:
      description: |
        Endpoint d'upsert. Si `id` est absent ou null dans le payload, un nouveau produit est créé. Si `id` est fourni et qu'un produit existe, il est mis à jour. Sinon, un nouveau produit est créé.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Produit créé
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Produit mis à jour
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
      summary: Créer ou mettre à jour un produit (admin)
      tags:
      - Products
      x-content-type: application/json
      x-accepts:
      - application/json
  /products/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Supprimé
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
      summary: Supprimer un produit (admin)
      tags:
      - Products
      x-accepts:
      - application/json
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ressource introuvable
      security: []
      summary: Détail d'un produit
      tags:
      - Products
      x-accepts:
      - application/json
    put:
      description: |
        Si le produit existe, il est mis à jour. Sinon, un nouveau produit est créé et l'identifiant retourné fait foi. Si `id` est aussi fourni dans le payload, il doit correspondre à l'identifiant du path.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Produit mis à jour
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Produit créé
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
      summary: Créer ou mettre à jour un produit par identifiant (admin)
      tags:
      - Products
      x-content-type: application/json
      x-accepts:
      - application/json
  /products/{id}/stock:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStock"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ressource introuvable
      summary: Consulter le stock d'un produit (admin)
      tags:
      - Products
      x-accepts:
      - application/json
    put:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductStockInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStock"
          description: Stock mis à jour
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Accès refusé (rôle insuffisant)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ressource introuvable
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Données invalides
      summary: Mettre à jour le stock d'un produit (admin)
      tags:
      - Products
      x-content-type: application/json
      x-accepts:
      - application/json
  /delivery-costs:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DeliverCost"
                type: array
          description: OK
      security: []
      summary: Liste des coûts de livraison
      tags:
      - DeliveryCosts
      x-accepts:
      - application/json
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverCostInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverCost"
          description: Coût de livraison créé
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Données invalides
      security: []
      summary: Créer un coût de livraison
      tags:
      - DeliveryCosts
      x-content-type: application/json
      x-accepts:
      - application/json
  /delivery-costs/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Supprimé
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token JWT manquant ou invalide
        "403":
          content:
            application/json:
