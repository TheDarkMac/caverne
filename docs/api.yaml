openapi: 3.0.3
info:
  title: La Caverne Malgache API
  description: |
    Documentation OpenAPI de La Caverne Malagasy.
    Couvre l'ensemble des ressources : utilisateurs, catalogue, commandes, paiements, livraisons.
  version: 1.0.0
  contact:
    name: Mr
servers:
  - url: http://localhost:8080/api/v1
    description: Serveur avec préfixe API versionné
    variables:
      version:
        default: v1
        description: Version HTTP exposée sous le préfixe `/api`

security:
  - BearerAuth: []

# ─────────────────────────────────────────────
# SECURITY
# ─────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ─── SCHEMAS ──────────────────────────────
  schemas:

    # ── AUTH ──
    LoginRequest:
      type: object
      required: [password]
      description: Fournir `email` ou `phone`, ou les deux.
      properties:
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600

    RegisterRequest:
      type: object
      required: [firstname, lastname, password]
      description: Fournir `email` ou `phone`, ou les deux.
      properties:
        firstname:
          type: string
          maxLength: 100
        lastname:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          maxLength: 20
          nullable: true
        password:
          type: string
          format: password

    # ── USER ──
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, simple_user]
        status:
          type: string

    UserUpdate:
      type: object
      properties:
        firstname:
          type: string
        lastname:
          type: string
        phone:
          type: string

    UserCreateInput:
      type: object
      required: [firstname, lastname, password]
      description: Fournir `email` ou `phone`, ou les deux.
      properties:
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        password:
          type: string
          format: password
        role:
          type: string
          enum: [admin, simple_user]
        status:
          type: string

    # ── ADDRESS ──
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        location:
          type: string
        postal_code:
          type: string
        country_code:
          type: string
          maxLength: 3
        is_default:
          type: boolean
          default: false

    AddressInput:
      type: object
      required: [location, postal_code, country_code]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        location:
          type: string
        postal_code:
          type: string
        country_code:
          type: string
          maxLength: 3
        is_default:
          type: boolean

    RecipientInput:
      type: object
      required: [location, postal_code, country_code, recipient_name, recipient_email, recipient_phone]
      properties:
        location:
          type: string
        postal_code:
          type: string
        country_code:
          type: string
          maxLength: 3
        recipient_name:
          type: string
        recipient_email:
          type: string
          format: email
        recipient_phone:
          type: string

    # ── CATEGORY ──
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        slug:
          type: string
        icon:
          type: string
          nullable: true
        map:
          type: string
          maxLength: 100
        parent_id:
          type: string
          format: uuid
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    CategoryInput:
      type: object
      required: [label, slug]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        label:
          type: string
        slug:
          type: string
        icon:
          type: string
          nullable: true
        map:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true

    CategoryRefInput:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid

    # ── PRODUCT ──
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/Category'
        label:
          type: string
          maxLength: 255
        reference:
          type: string
          maxLength: 100
        limit_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
        weight:
          type: number
          format: double
        length:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        stock_quantity:
          type: number
          format: double
        is_active:
          type: boolean
          default: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'

    ProductInput:
      type: object
      required: [category, label, reference]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        category:
          $ref: '#/components/schemas/CategoryRefInput'
        label:
          type: string
        reference:
          type: string
        limit_date:
          type: string
          format: date
        description:
          type: string
        weight:
          type: number
          format: double
        length:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        is_active:
          type: boolean
        stock_quantity:
          type: number
          format: double
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImageInput'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PriceInput'

    ProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        main:
          type: boolean
          default: false

    ProductImageInput:
      type: object
      required: [url]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        url:
          type: string
          format: uri
        main:
          type: boolean

    ProductStock:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: number
          format: double

    ProductStockInput:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: number
          format: double

    # ── PRICE ──
    Price:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        currency_code:
          type: string
          maxLength: 3
        value:
          type: number
          format: double
        valid_from:
          type: string
          format: date
        unit:
          type: string

    PriceInput:
      type: object
      required: [currency_code, value, valid_from, unit]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        currency_code:
          type: string
          maxLength: 3
        value:
          type: number
          format: double
        valid_from:
          type: string
          format: date
        unit:
          type: string

    # ── ORDER ──
    OrderItem:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: number
          format: double
        unit_price:
          type: number
          format: double
        total_price:
          type: number
          format: double

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        currency_code:
          type: string
        reference:
          type: string
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, confirmed, delivered, cancelled]
        total_amount:
          type: number
          format: double
        delivery_cost_id:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        recipient:
          $ref: '#/components/schemas/RecipientInput'

    OrderInput:
      type: object
      required: [currency_code, items, recipient]
      properties:
        address_id:
          type: string
          format: uuid
          nullable: true
        delivery_cost_id:
          type: string
          format: uuid
          nullable: true
        currency_code:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: number
                format: double
        recipient:
          $ref: '#/components/schemas/RecipientInput'

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, delivered, cancelled]

    # ── DELIVER COST ──
    DeliverCost:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        provider:
          type: string
        response_provider:
          type: object
          nullable: true

    DeliverCostInput:
      type: object
      required: [amount, provider]
      properties:
        amount:
          type: number
          format: double
        provider:
          type: string

    # ── PAYMENT METHOD ──
    PaymentMethod:
      type: object
      properties:
        provider_code:
          type: string
        label:
          type: string
          maxLength: 100
        is_active:
          type: boolean
        requires_manual_check:
          type: boolean
        integration_type:
          type: string
          enum: [manual, api, webhook]

    PaymentMethodInput:
      type: object
      required: [provider_code, label, integration_type]
      properties:
        provider_code:
          type: string
        label:
          type: string
        is_active:
          type: boolean
        requires_manual_check:
          type: boolean
        integration_type:
          type: string
          enum: [manual, api, webhook]

    # ── PAYMENT ──
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        method_code:
          type: string
        currency_code:
          type: string
        amount:
          type: number
          format: double
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, confirmed, failed, refunded]
        internal_reference:
          type: string
        provider_response:
          type: object
          nullable: true
          description: >
            Sous-ensemble contrôlé de la réponse du provider. L'API ne renvoie pas l'objet Stripe complet.
            Pour Stripe Checkout, contient notamment `checkout_url`, `checkout_session_id`,
            `checkout_status` et `payment_status`.

    PaymentInput:
      type: object
      description: >
        Le `method_code` doit correspondre à un `provider_code` retourné par `/payment-methods`
        (ex : MANUAL, STRIPE).
      required: [method_code, currency_code, amount]
      properties:
        method_code:
          type: string
        currency_code:
          type: string
        amount:
          type: number
          format: double

    # ── COMMON ──
    PaginatedMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        last_page:
          type: integer

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

    # ── STRIPE WEBHOOK ──
    StripeEvent:
      type: object
      description: |
        Event Stripe (https://stripe.com/docs/api/events/object).
        Seuls les champs exploités par le serveur sont listés ; les autres
        propriétés transmises par Stripe sont conservées.
      additionalProperties: true
      required: [id, type, data]
      properties:
        id:
          type: string
          description: Identifiant d'event Stripe (utilisé pour l'idempotence).
          example: evt_1NmVHx2eZvKYlo2CqZ3a1b2c
        type:
          type: string
          description: |
            Type d'event. Traités comme `confirmed` :
            `checkout.session.completed`, `checkout.session.async_payment_succeeded`,
            `payment_intent.succeeded`. Traités comme `failed` :
            `checkout.session.async_payment_failed`, `checkout.session.expired`,
            `payment_intent.payment_failed`. Les autres restent en `pending`.
          example: checkout.session.completed
        api_version:
          type: string
          example: '2024-06-20'
        created:
          type: integer
          format: int64
          description: Timestamp Unix de création de l'event.
        livemode:
          type: boolean
        data:
          type: object
          required: [object]
          properties:
            object:
              $ref: '#/components/schemas/StripeEventObject'
        request:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
              nullable: true
            idempotency_key:
              type: string
              nullable: true

    StripeEventObject:
      type: object
      description: |
        Ressource Stripe imbriquée dans `data.object`. Selon `type` de l'event,
        il s'agit d'une `checkout.session` (id préfixé `cs_`) ou d'un
        `payment_intent` (id préfixé `pi_`). Le serveur utilise `id` pour
        retrouver l'`OrderPayment` (via `stripe_payment_intent_id` pour les
        events `payment_intent.*`, sinon via `internal_reference` pour les
        events `checkout.session.*`).
      additionalProperties: true
      required: [id]
      properties:
        id:
          type: string
          example: cs_test_a1B2c3D4e5F6g7H8i9J0
        object:
          type: string
          enum: [checkout.session, payment_intent]
        status:
          type: string
          description: |
            Statut Stripe. Pour `checkout.session` : `open`, `complete`, `expired`.
            Pour `payment_intent` : `succeeded`, `processing`, `requires_payment_method`, etc.
        payment_status:
          type: string
          description: Présent sur `checkout.session` (ex. `paid`, `unpaid`, `no_payment_required`).
        payment_intent:
          type: string
          description: Présent sur `checkout.session` (id du PaymentIntent associé).
          example: pi_3NmVHx2eZvKYlo2C0abc1234
        amount_total:
          type: integer
          description: Montant total en plus petite unité (centimes pour EUR).
        amount:
          type: integer
          description: Montant sur `payment_intent`, en plus petite unité.
        currency:
          type: string
          example: eur
        customer:
          type: string
          nullable: true
        mode:
          type: string
          enum: [payment, setup, subscription]

  # ─── RESPONSES ────────────────────────────
  responses:
    Unauthorized:
      description: Token JWT manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Accès refusé (rôle insuffisant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Données invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflit — la ressource viole une contrainte d'unicité
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # ─── PARAMETERS ───────────────────────────
  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    queryPage:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    queryPerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ═══════════════════════════
  # AUTH
  # ═══════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Inscription d'un nouvel utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion — obtenir un JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token JWT retourné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidation du token JWT courant
      responses:
        '204':
          description: Déconnexion réussie
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════
  # USERS
  # ═══════════════════════════
  /users:
    post:
      tags: [Users]
      summary: Créer un utilisateur (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [Users]
      summary: Liste des utilisateurs (admin)
      parameters:
        - $ref: '#/components/parameters/queryPage'
        - $ref: '#/components/parameters/queryPerPage'
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, simple_user]
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/me:
    get:
      tags: [Users]
      summary: Profil de l'utilisateur connecté
      responses:
        '200':
          description: Profil retourné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      summary: Mise à jour du profil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/pathId'
    get:
      tags: [Users]
      summary: Détail d'un utilisateur (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Suppression d'un utilisateur (admin)
      responses:
        '204':
          description: Supprimé
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════
  # ADDRESSES
  # ═══════════════════════════
  /users/me/addresses:
    get:
      tags: [Addresses]
      summary: Liste des adresses de l'utilisateur connecté
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Addresses]
      summary: Créer ou mettre à jour une adresse
      description: >
        Endpoint d'upsert. Si `id` est absent ou null dans le payload, une nouvelle adresse est créée.
        Si `id` est fourni et qu'une adresse appartenant à l'utilisateur existe, elle est mise à jour.
        Sinon, une nouvelle adresse est créée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Adresse créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '200':
          description: Adresse mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/addresses/{id}:
    parameters:
      - $ref: '#/components/parameters/pathId'
    put:
      tags: [Addresses]
      summary: Créer ou mettre à jour une adresse par identifiant
      description: >
        Si l'adresse existe pour l'utilisateur connecté, elle est mise à jour.
        Sinon, une nouvelle adresse est créée et l'identifiant retourné fait foi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Adresse mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '201':
          description: Adresse créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Addresses]
      summary: Supprimer une adresse
      responses:
        '204':
          description: Supprimée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/addresses/{id}/default:
    parameters:
      - $ref: '#/components/parameters/pathId'
    put:
      tags: [Addresses]
      summary: Définir comme adresse par défaut
      responses:
        '200':
          description: Adresse définie par défaut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════
  # CATEGORIES
  # ═══════════════════════════
  /categories:
    get:
      tags: [Categories]
      summary: Liste des catégories (arbre)
      security: []
      parameters:
        - name: flat
          in: query
          description: Si true, retourne une liste plate sans enfants
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Créer ou mettre à jour une catégorie (admin)
      description: >
        Endpoint d'upsert. Si `id` est absent ou null dans le payload, une nouvelle catégorie est créée.
        Si `id` est fourni, la catégorie existante correspondante doit être mise à jour.
        Le champ `label` doit être unique (insensible à la casse) parmi toutes les catégories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Créée quand `id` est absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '200':
          description: Mise à jour quand `id` est fourni
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/pathId'
    get:
      tags: [Categories]
      summary: Détail d'une catégorie
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Créer ou mettre à jour une catégorie par identifiant (admin)
      description: >
        Si la catégorie existe, elle est mise à jour.
        Sinon, une nouvelle catégorie est créée et l'identifiant retourné fait foi.
        Si `id` est aussi fourni dans le payload, il doit correspondre à l'identifiant du path.
        Le champ `label` doit être unique (insensible à la casse) parmi toutes les catégories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Catégorie mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Categories]
      summary: Supprimer une catégorie (admin)
      responses:
        '204':
          description: Supprimée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════
  # PRODUCTS
  # ═══════════════════════════
  /products:
    get:
      tags: [Products]
      summary: Catalogue produits
      security: []
      parameters:
        - $ref: '#/components/parameters/queryPage'
        - $ref: '#/components/parameters/queryPerPage'
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: currency
          in: query
          schema:
            type: string
            example: MGA
        - name: price_date
          in: query
          description: >
            Effective price date (ISO 8601). Returns the most recent price whose `validFrom`
            is on or before this date, per (currency, unit) pair. Defaults to today.
          schema:
            type: string
            format: date
            example: '2025-06-01'
        - name: price_from
          in: query
          description: >
            Range start for price history view (ISO 8601). When set, all price records
            with `validFrom >= price_from` are returned. Takes precedence over `price_date`.
          schema:
            type: string
            format: date
            example: '2025-01-01'
        - name: price_to
          in: query
          description: >
            Range end for price history view (ISO 8601). When set, all price records
            with `validFrom <= price_to` are returned. Takes precedence over `price_date`.
          schema:
            type: string
            format: date
            example: '2025-12-31'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
    post:
      tags: [Products]
      summary: Créer ou mettre à jour un produit (admin)
      description: >
        Endpoint d'upsert. Si `id` est absent ou null dans le payload, un nouveau produit est créé.
        Si `id` est fourni et qu'un produit existe, il est mis à jour.
        Sinon, un nouveau produit est créé.
        Les champs `label` et `reference` doivent être uniques (insensibles à la casse) parmi tous les produits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produit créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '200':
          description: Produit mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/pathId'
    get:
      tags: [Products]
      summary: Détail d'un produit
      security: []
      parameters:
        - name: price_date
          in: query
          description: >
            Effective price date (ISO 8601). Returns the most recent price whose `validFrom`
            is on or before this date, per (currency, unit) pair. Defaults to today.
          schema:
            type: string
            format: date
            example: '2025-06-01'
        - name: price_from
          in: query
          description: >
            Range start for price history view (ISO 8601). When set, all price records
            with `validFrom >= price_from` are returned. Takes precedence over `price_date`.
          schema:
            type: string
            format: date
            example: '2025-01-01'
        - name: price_to
          in: query
          description: >
            Range end for price history view (ISO 8601). When set, all price records
            with `validFrom <= price_to` are returned. Takes precedence over `price_date`.
          schema:
            type: string
            format: date
            example: '2025-12-31'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Créer ou mettre à jour un produit par identifiant (admin)
      description: >
        Si le produit existe, il est mis à jour.
        Sinon, un nouveau produit est créé et l'identifiant retourné fait foi.
        Si `id` est aussi fourni dans le payload, il doit correspondre à l'identifiant du path.
        Les champs `label` et `reference` doivent être uniques (insensibles à la casse) parmi tous les produits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Produit mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '201':
          description: Produit créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Products]
      summary: Supprimer un produit (admin)
      responses:
        '204':
          description: Supprimé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /products/{id}/stock:
    parameters:
      - $ref: '#/components/parameters/pathId'
    get:
      tags: [Products]
      summary: Consulter le stock d'un produit (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductStock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Mettre à jour le stock d'un produit (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductStockInput'
      responses:
        '200':
          description: Stock mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductStock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ═══════════════════════════
  # DELIVERY COSTS
  # ═══════════════════════════
  /delivery-costs:
    get:
      tags: [DeliveryCosts]
      summary: Liste des coûts de livraison
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
