          application/json:
            schema:
              $ref: '#/components/schemas/DeliverCostInput'
      responses:
        '201':
          description: Coût de livraison créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverCost'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /delivery-costs/{id}:
    parameters:
      - $ref: '#/components/parameters/pathId'
    get:
      tags: [DeliveryCosts]
      summary: Détail d'un coût de livraison
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverCost'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [DeliveryCosts]
      summary: Mettre à jour un coût de livraison (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverCostInput'
      responses:
        '200':
          description: Coût de livraison mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverCost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [DeliveryCosts]
      summary: Supprimer un coût de livraison (admin)
      responses:
        '204':
          description: Supprimé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════
  # ORDERS
  # ═══════════════════════════
  /orders:
    get:
      tags: [Orders]
      summary: Mes commandes (utilisateur connecté)
      parameters:
        - $ref: '#/components/parameters/queryPage'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, delivered, cancelled]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
    post:
      tags: [Orders]
      summary: Passer une commande
      description: >
        Crée une commande et décrémente le stock de chaque produit demandé.
        Le stock est verrouillé en écriture (SELECT FOR UPDATE) pendant la transaction,
        de sorte que deux commandes concurrentes sur le même produit sont sérialisées :
        la seconde relit le stock à jour et reçoit `422` si la quantité est insuffisante.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Commande créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Payload invalide ou stock insuffisant pour un produit demandé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/all:
    get:
      tags: [Orders]
      summary: Toutes les commandes (admin)
      parameters:
        - $ref: '#/components/parameters/queryPage'
        - $ref: '#/components/parameters/queryPerPage'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, delivered, cancelled]
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/pathId'
    get:
      tags: [Orders]
      summary: Détail d'une commande
      security: []
      description: >
        Les commandes invitées peuvent être consultées sans authentification.
        Les commandes liées à un utilisateur nécessitent que l'acteur soit le propriétaire ou un admin.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/pathId'
    put:
      tags: [Orders]
      summary: Changer le statut d'une commande (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/pathId'
    post:
      tags: [Orders]
      summary: Annuler une commande (owner ou admin)
      security: []
      responses:
        '200':
          description: Commande annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════
  # PAYMENT METHODS
  # ═══════════════════════════
  /payment-methods:
    get:
      tags: [Payments]
      summary: Liste des moyens de paiement disponibles
      security: []
      responses:
        '200':
          description: Moyens disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'

  /payments/webhooks/stripe:
    post:
      tags: [Payments]
      summary: Webhook Stripe Checkout
      description: |
        Endpoint invoqué par Stripe. Le corps est un objet Event Stripe brut
        (https://stripe.com/docs/api/events/object). Les requêtes doivent porter
        l'en-tête `Stripe-Signature` ; il est vérifié contre `stripe.webhook-secret`.
      security: []
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema:
            type: string
          description: |
            Signature Stripe au format `t=<timestamp>,v1=<hmac_sha256>`.
            Générée par Stripe à partir du secret de webhook configuré.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent'
      responses:
        '204':
          description: Webhook traité
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Erreur interne lors du traitement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Webhook Stripe non configuré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ═══════════════════════════
  # PAYMENTS
  # ═══════════════════════════
  /orders/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/pathId'
    get:
      tags: [Payments]
      summary: Paiements associés à une commande
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
    post:
      tags: [Payments]
      summary: Initier un paiement
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Paiement initié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

tags:
  - name: Auth
    description: Inscription, connexion, JWT
  - name: Users
    description: Gestion des comptes utilisateurs
  - name: Addresses
    description: Adresses de livraison
  - name: Categories
    description: Arborescence de catégories produits
  - name: Products
    description: Catalogue produits
  - name: Orders
